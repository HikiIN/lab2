<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 2.1 — Варіант 20</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f7fafc; margin: 40px; }
        .box { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
        button { margin-top: 20px; width: 100%; padding: 10px; background: #3182ce; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        button:hover { background: #2b6cb0; }
        a { display: inline-block; margin-top: 15px; color: #3182ce; }
    </style>
</head>
<body>
<div class="box">
    <h2>Завдання 2.1: Ряд для e<sup>-x</sup></h2>
    <form action="task1" method="POST">
        <label for="x">Параметр x:</label>
        <input type="text" id="x" name="x" value="1.0" required>

        <label for="n">Кількість доданків n:</label>
        <input type="number" id="n" name="n" min="1" max="100" value="10" required>

        <label for="e1">Точність e1:</label>
        <input type="text" id="e1" name="e1" value="0.001" required>

        <label for="e2">Точність e2 (на порядок менша):</label>
        <input type="text" id="e2" name="e2" value="0.0001" required>

        <button type="submit">Розрахувати</button>
    </form>
    <a href="index.html">&larr; До вибору завдань</a>
</div>
</body>
</html>
